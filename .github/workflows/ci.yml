name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app/
        env:
          DATABASE_URL: postgresql://vault:vault@localhost:5432/vault_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
          PROVIDER_SIM_URL: http://localhost:8001
          PROVIDER_SIM_SECRET: test-sim-secret

      - name: Module boundary check (import-linter)
        run: lint-imports
        env:
          DATABASE_URL: postgresql://vault:vault@localhost:5432/vault_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
          PROVIDER_SIM_URL: http://localhost:8001
          PROVIDER_SIM_SECRET: test-sim-secret

      - name: Tests (pytest)
        run: pytest
        env:
          DATABASE_URL: postgresql://vault:vault@localhost:5432/vault_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret
          PROVIDER_SIM_URL: http://localhost:8001
          PROVIDER_SIM_SECRET: test-sim-secret

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
